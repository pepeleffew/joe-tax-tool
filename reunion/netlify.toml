# Netlify config for the Soddy-Daisy Class of 1993 site.
# In the Netlify UI, set this site's "Base directory" to: reunion
# (so Netlify reads THIS file, not the tax-tool config at the repo root).

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache photos but always revalidate, so re-processed images (same filename)
# still refresh for returning visitors.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
