# Netlify config for the Soddy-Daisy Class of 1993 site.
# In the Netlify UI, set this site's "Base directory" to: reunion
# (so Netlify reads THIS file, not the tax-tool config at the repo root).

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always revalidate site code, data, and images so updates show up on a normal
# visit — no hard-refresh needed. Netlify's ETags mean unchanged files are still
# served from cache (a quick 304), so this stays fast.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
