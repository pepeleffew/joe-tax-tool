# =============================================================================
# Netlify configuration — Strike Zone Chattanooga (static site)
# =============================================================================

[build]
  # Pure static site: just publish the public/ folder. No build step needed.
  publish = "public"

# Always re-fetch the HTML so updated asset references are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Versioned logo/image assets can be cached hard (filenames change when updated).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
